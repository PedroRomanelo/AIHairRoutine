services:
  api:
    build: .
    ports:
      - "8080:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      Database__ConnectionString: "Server=sqlserver,1433;Database=AIHairRoutine;User Id=sa;Password=HairRoutine!Dev123;TrustServerCertificate=True;Encrypt=False"
      Database__RunMigrationsOnStartup: "true"
      # Provide these to enable the AI paths; empty = rules + template fallback.
      Jev__ApiKey: "${JEV_API_KEY:-}"
      Anthropic__ApiKey: "${ANTHROPIC_API_KEY:-}"
    depends_on:
      sqlserver:
        condition: service_healthy

  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "HairRoutine!Dev123"
    ports:
      - "1433:1433"
    healthcheck:
      test: ["CMD", "/opt/mssql-tools18/bin/sqlcmd", "-S", "localhost", "-U", "sa", "-P", "HairRoutine!Dev123", "-C", "-Q", "SELECT 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  # Uncomment when you outgrow a single instance: HybridCache uses this as the shared L2.
  # redis:
  #   image: redis:7-alpine
  #   ports:
  #     - "6379:6379"
